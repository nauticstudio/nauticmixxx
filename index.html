    <script id="platform-detection">
      // Apply before the first paint; React hydrates the same static markup.
      (() => {
        const agent = navigator.userAgent || "";
        const hints = navigator.userAgentData;
        const platform = hints?.platform || navigator.platform || "";
        const mobile =
          hints?.mobile ||
          /Android|iPhone|iPad|iPod|Windows Phone/i.test(agent) ||
          (/Mac/i.test(platform) && navigator.maxTouchPoints > 1);
        let system = "other";
        if (!mobile) {
          if (/Win/i.test(platform)) system = "windows";
          else if (/Mac/i.test(platform)) system = "mac";
          else if (/Windows NT/i.test(agent)) system = "windows";
          else if (/Macintosh|Mac OS X/i.test(agent)) system = "mac";
        }
        document.documentElement.dataset.desktopOs = system;
      })();
    </script>
